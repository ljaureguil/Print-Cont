    function drawPath2(canvas) {
        if (canvas.arf === undefined || canvas.arf === null || canvas.arf === "") return;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        var a = canvas.arf;


        for (let i = 0; i < a.length; i += 2) {
            const point = a[i];
            if (i === 0) {
                ctx.moveTo(a.charCodeAt(i), a.charCodeAt(i + 1));
            } else {
                ctx.lineTo(a.charCodeAt(i), a.charCodeAt(i + 1));
            }
        }
        ctx.stroke();
    }

    function drawPath(canvas) {
        if (canvas.arf === undefined || canvas.arf === null || canvas.arf === "") return;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        var a = canvas.arf;

        var ars = canvas.arf.split("marcador");

        for (var v = 0; v < ars.length; v++) {
            a = ars[v];
            for (let i = 0; i < a.length; i += 2) {
                const point = a[i];
                if (i === 0) {
                    ctx.moveTo(a.charCodeAt(i), a.charCodeAt(i + 1));
                } else {
                    ctx.lineTo(a.charCodeAt(i), a.charCodeAt(i + 1));
                }
            }
            ctx.stroke();
        }
    }

    function setgr(canvas) {


        //  canvas; // = document.getElementById('firc');
        const ctx = canvas.getContext('2d');
        // const clearBtn = document.getElementById('sig-clear');
        //  const saveBtn = document.getElementById('sig-save');

        let isDrawing = false;

        // Fixes blurry lines on retina displays & handles fluid resizing
        function setupCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            // Line style settings
            ctx.strokeStyle = '#000099';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            /*
                        const dataurl = localStorage.getItem("firma");
                        if (dataurl != null) {
                            const img = new Image();
                            img.onload = function () {
                                // FIX: Pass rect.width and rect.height to constraint proportions into the layout area
                                ctx.drawImage(img, 0, 0, rect.width, rect.height);
                            };
                            img.src = dataurl;
                        }*/
            drawPath(canvas)

        }

        // Get position relative to canvas wrapper element
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Draw Event Logic
        function start(e) {
            isDrawing = true;
            const coords = getCoords(e);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
            //aqui 
            if (canvas.arf !== "") canvas.arf += "marcador";

            canvas.arf += String.fromCharCode(coords.x);
            canvas.arf += String.fromCharCode(coords.y);
            if (e.cancelable) e.preventDefault();
        }

        function move(e) {
            if (!isDrawing) return;
            const coords = getCoords(e);
            ctx.lineTo(coords.x, coords.y);

            canvas.arf += String.fromCharCode(coords.x);
            canvas.arf += String.fromCharCode(coords.y);

            ctx.stroke();
            if (e.cancelable) e.preventDefault();
        }

        function stop() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
            }
        }

        // Desktop Mouse Events
        if (obfe.acc && canvas.id === "firc") {
            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            window.addEventListener('mouseup', stop);

            // Mobile/Tablet Touch Events
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        // Control Buttons
        /*      clearBtn.addEventListener('click', () => {
                  ctx.clearRect(0, 0, canvas.width, canvas.height);
                  localStorage.removeItem("firma"); // Optional: clear storage too
              });
      
              saveBtn.addEventListener('click', () => {

                  console.log('Your Signature Data URL:', dataURL);
                  localStorage.setItem("firma", dataURL);
                  alert('Signature Saved! (Check your developer console to see the exported image string)');
              });
              */

        // Run setup on load and whenever window resizes
        setupCanvas();
        window.addEventListener('resize', setupCanvas);

    }
